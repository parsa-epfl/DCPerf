services:
  feedsim-inst1:
    build:
      context: ../../..
      dockerfile: packages/feedsim/docker/Dockerfile.qflex
      target: lean
      args:
        ARCH: ${ARCH:-arm64}
    image: docker.io/akrishnaams/dcperf-feedsim-${ARCH:-arm64}:latest
    container_name: feedsim-inst1
    privileged: true
    networks:
      - feedsim-network-inst1
    cpuset: "${SERVER_NODE_CPUS_INST1},${CLIENT_NODE_CPUS_INST1}"
    environment:
      - THRIFT_THREADS=${THRIFT_THREADS}
      - RANKING_THREADS=${RANKING_THREADS}
      - SRV_IO_THREADS=${SRV_IO_THREADS}
      - EVENTBASE_THREADS=${EVENTBASE_THREADS}
      - SRV_THREADS=${SRV_THREADS}
      - DRIVER_THREADS=${DRIVER_THREADS}
      - WARMUP_DURATION=${WARMUP_DURATION}
      - FIXED_QPS_DURATION=${FIXED_QPS_DURATION}
      - FIXED_QPS=${FIXED_QPS}
      - SERVER_NODE_CPUS=${SERVER_NODE_CPUS_INST1}
      - CLIENT_NODE_CPUS=${CLIENT_NODE_CPUS_INST1}

  feedsim-inst2:
    build:
      context: ../../..
      dockerfile: packages/feedsim/docker/Dockerfile.qflex
      target: lean
      args:
        ARCH: ${ARCH:-arm64}
    image: docker.io/akrishnaams/dcperf-feedsim-${ARCH:-arm64}:latest
    container_name: feedsim-inst2
    privileged: true
    networks:
      - feedsim-network-inst2
    cpuset: "${SERVER_NODE_CPUS_INST2},${CLIENT_NODE_CPUS_INST2}"
    environment:
      - THRIFT_THREADS=${THRIFT_THREADS}
      - RANKING_THREADS=${RANKING_THREADS}
      - SRV_IO_THREADS=${SRV_IO_THREADS}
      - EVENTBASE_THREADS=${EVENTBASE_THREADS}
      - SRV_THREADS=${SRV_THREADS}
      - DRIVER_THREADS=${DRIVER_THREADS}
      - WARMUP_DURATION=${WARMUP_DURATION}
      - FIXED_QPS_DURATION=${FIXED_QPS_DURATION}
      - FIXED_QPS=${FIXED_QPS}
      - SERVER_NODE_CPUS=${SERVER_NODE_CPUS_INST2}
      - CLIENT_NODE_CPUS=${CLIENT_NODE_CPUS_INST2}

  feedsim-inst3:
    build:
      context: ../../..
      dockerfile: packages/feedsim/docker/Dockerfile.qflex
      target: lean
      args:
        ARCH: ${ARCH:-arm64}
    image: docker.io/akrishnaams/dcperf-feedsim-${ARCH:-arm64}:latest
    container_name: feedsim-inst3
    privileged: true
    networks:
      - feedsim-network-inst3
    cpuset: "${SERVER_NODE_CPUS_INST3},${CLIENT_NODE_CPUS_INST3}"
    environment:
      - THRIFT_THREADS=${THRIFT_THREADS}
      - RANKING_THREADS=${RANKING_THREADS}
      - SRV_IO_THREADS=${SRV_IO_THREADS}
      - EVENTBASE_THREADS=${EVENTBASE_THREADS}
      - SRV_THREADS=${SRV_THREADS}
      - DRIVER_THREADS=${DRIVER_THREADS}
      - WARMUP_DURATION=${WARMUP_DURATION}
      - FIXED_QPS_DURATION=${FIXED_QPS_DURATION}
      - FIXED_QPS=${FIXED_QPS}
      - SERVER_NODE_CPUS=${SERVER_NODE_CPUS_INST3}
      - CLIENT_NODE_CPUS=${CLIENT_NODE_CPUS_INST3}

networks:
  feedsim-network-inst1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  feedsim-network-inst2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
  feedsim-network-inst3:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
